<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Palworld Manager</title>
  </head>
  <body>

      <h1>Palworld Manager</h1>
