[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "palworld-manager"
version = "0.1.0"
description = "Painel privado para administração de um servidor dedicado de Palworld."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=25.1,<26",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "psutil>=6.1,<8",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.9,<3",
    "mypy>=1.13,<2",
    "pre-commit>=4,<5",
    "pytest>=8.3,<10",
    "ruff>=0.8,<1",
    "types-psutil>=6.1,<8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "static/dist/*.css",
    "static/dist/*.js",
    "static/dist/*.svg",
    "static/dist/vendor/*.js",
    "templates/*.html",
    "templates/**/*.html",
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
files = ["app", "mock-services", "tests"]
python_version = "3.12"
strict = true
