x-app-service: &app-service
  image: palworld-manager:dev
  environment:
    APP_ENVIRONMENT: development
    APP_HOST: 0.0.0.0
    APP_PORT: "8080"
    IN_CONTAINER: "1"
    PYTHONPATH: /workspace
  init: true
  volumes:
    - .:/workspace

services:
  app:
    <<: *app-service
    build:
      context: .
    command: ["python", "-m", "app.web"]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    <<: *app-service
    command: ["python", "-m", "app.worker"]

  mock-services:
    <<: *app-service
    command:
      - uvicorn
      - main:app
      - --app-dir
      - mock-services
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - --reload
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
