x-app-service: &app-service
  image: palworld-manager:dev
  environment:
    APP_ENVIRONMENT: development
    APP_HOST: 0.0.0.0
    APP_PORT: "8080"
    IN_CONTAINER: "1"
    PYTHONPATH: /workspace
  init: true

x-manager-volumes: &manager-volumes
  - .:/workspace
  - manager-data:/var/lib/palworld-manager
  - /workspace/node_modules

services:
  app:
    <<: *app-service
    build:
      context: .
    command: ["sh", "-c", "npm run build && python -m app.web"]
    volumes: *manager-volumes
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    <<: *app-service
    command: ["python", "-m", "app.worker"]
    volumes: *manager-volumes

  mock-services:
    <<: *app-service
    command:
      - uvicorn
      - main:app
      - --app-dir
      - mock-services
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - --reload
    volumes:
      - .:/workspace
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  e2e:
    image: palworld-manager-e2e:dev
    build:
      context: .
      target: e2e
    environment:
      APP_ENVIRONMENT: test
      APP_HOST: 127.0.0.1
      APP_PORT: "8081"
      E2E_HOST: 127.0.0.1
      E2E_PORT: "8081"
      IN_CONTAINER: "1"
      PLAYWRIGHT_OUTPUT_DIR: /tmp/palworld-manager-playwright-results
      PYTHONPATH: /workspace
    command: ["npm", "run", "e2e"]
    init: true
    profiles: ["e2e"]
    shm_size: "1gb"

volumes:
  manager-data:
